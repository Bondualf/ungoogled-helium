name: Build Ungoogled Helium

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install depot_tools
        run: |
          cd %TEMP%
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "%TEMP%\depot_tools" >> %GITHUB_PATH%

      - name: Fetch Helium / Chromium sources
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          mkdir %TEMP%\build
          cd /d %TEMP%\build
          fetch --no-history chromium

      - name: Apply Unbinding Patch
        run: |
          cd /d %TEMP%\build\src
          git apply --ignore-whitespace %GITHUB_WORKSPACE%/patches/remove_restrictions.patch

      - name: Generate Build Files (GN)
        run: |
          cd /d %TEMP%\build\src
          gn gen out/Release "--args=is_debug=false is_official_build=true symbol_level=0 blink_symbol_level=0"

      - name: Compile Browser (Ninja)
        run: |
          cd /d %TEMP%\build\src
          autoninja -C out/Release chrome

      - name: Pack Artifacts
        run: |
          mkdir %GITHUB_WORKSPACE%\dist
          xcopy %TEMP%\build\src\out\Release\chrome.exe %GITHUB_WORKSPACE%\dist\
          xcopy %TEMP%\build\src\out\Release\*.dll %GITHUB_WORKSPACE%\dist\ /S /Y
          cd /d %GITHUB_WORKSPACE%\dist
          powershell Compress-Archive -Path * -DestinationPath %GITHUB_WORKSPACE%\ungoogled-helium-win64.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ungoogled-helium-win64.zip
