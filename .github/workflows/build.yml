name: Build Ungoogled Helium

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install depot_tools
        shell: cmd
        run: |
          cd /d %TEMP%
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo %TEMP%\depot_tools>>%GITHUB_PATH%

      - name: Fetch Chromium sources
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          if not exist C:\build mkdir C:\build
          cd /d C:\build
          fetch --no-history chromium

      - name: Apply Patch
        shell: cmd
        run: |
          cd /d C:\build\src
          git apply --ignore-whitespace %GITHUB_WORKSPACE%\patches\remove_restrictions.patch

      - name: Generate Build Files (GN)
        shell: cmd
        run: |
          cd /d C:\build\src
          gn gen out/Release "--args=is_debug=false is_official_build=true symbol_level=0 blink_symbol_level=0"

      - name: Compile Browser
        shell: cmd
        run: |
          cd /d C:\build\src
          autoninja -C out/Release chrome

      - name: Pack Artifacts
        shell: cmd
        run: |
          if not exist %GITHUB_WORKSPACE%\dist mkdir %GITHUB_WORKSPACE%\dist
          copy C:\build\src\out\Release\chrome.exe %GITHUB_WORKSPACE%\dist\
          powershell Compress-Archive -Path %GITHUB_WORKSPACE%\dist\* -DestinationPath %GITHUB_WORKSPACE%\ungoogled-helium-win64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ungoogled-helium-win64
          path: ungoogled-helium-win64.zip
